name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build
        run: mvn -B -DskipTests package
      - name: Unit tests
        run: ./bin/test
      - name: CLI smoke test
        run: |
          ./credit_simulator file_inputs.txt | grep -F 'Rp. 2,250,000.00/bln'
          printf 'show\nexit\n' | ./credit_simulator | grep -F 'save sheet'
      - name: Docker build
        run: docker build -t credit-simulator:ci .
      - name: Docker smoke test
        run: |
          docker run --rm credit-simulator:ci file_inputs.txt | grep -F 'Rp. 2,250,000.00/bln'
          printf 'show\nexit\n' | docker run --rm -i credit-simulator:ci | grep -F 'save sheet'

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/credit-simulator:${{ github.ref_name }}
